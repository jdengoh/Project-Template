[project]
name = "my-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.165.0",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "pyyaml>=6.0.4",
  "rich>=15.0.0",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["httpx2>=2.16.2", "pre-commit>=4.7.0", "pytest>=9.2.0", "ruff>=0.17.6"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]                   # line length is handled by ruff-format

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pyright]
venvPath = "."
venv = ".venv"
